[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "toolpath-lab"
version = "1.0.0"
description = "刀路规划实验室 - 一个基于Python的CNC刀路规划工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "阳佳琪", email = "your-email@example.com"}
]
keywords = ["toolpath", "cnc", "machining", "cam", "planning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
visualization = [
    "matplotlib>=3.5.0",
]
all = [
    "toolpath-lab[dev,visualization]",
]

[project.urls]
Homepage = "https://github.com/large-su/toolpath-lab"
Documentation = "https://github.com/large-su/toolpath-lab#readme"
Repository = "https://github.com/large-su/toolpath-lab"
Issues = "https://github.com/large-su/toolpath-lab/issues"

[project.scripts]
toolpath-lab = "toolpath_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolpath_lab*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["toolpath_lab"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.",
    "pass",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
